<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pipeline · Roll-up Envases Alimentarios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --surface:#ffffff; --panel:#f7f7ff; --panel-2:#f3f2ff; --nav:#f5f2ff;
    --ink:#142238; --ink-dim:#667085; --muted:#8d93a5; --line:#e5e7ef; --line-strong:#d7dbe8;
    --blue:#5f63ff; --blue-soft:#eeefff; --green:#3faa56; --green-dark:#0b6b4a; --danger:#c84646;
    --shadow:0 18px 35px rgba(20,34,56,.08); --shadow-soft:0 6px 20px rgba(20,34,56,.06);
    --font-display:'Inter', sans-serif; --font-body:'Inter', sans-serif; --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html, body{ max-width:100%; overflow-x:hidden; }
  body{margin:0; background:var(--bg);}
  #app{ font-family:var(--font-body); color:var(--ink); background:var(--bg); min-height:100vh; display:flex; flex-direction:column; }
  svg{ display:block; }
  .topbar{ height:68px; padding:0 18px 0 102px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:18px; background:#fff; }
  .admin-pill{ display:inline-flex; align-items:center; gap:8px; background:#17192b; color:#fff; border-radius:999px; padding:8px 14px; font-weight:800; font-size:14px; box-shadow:var(--shadow-soft); }
  .admin-pill svg{ width:16px; height:16px; }
  .userbar{ display:flex; align-items:center; gap:10px; }
  .user-chip{ display:flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:999px; padding:8px 14px 8px 8px; font-weight:800; color:#292b43; background:#fff; }
  .avatar{ width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:#f0effb; color:#63627a; font-weight:800; }
  .bell-btn{ width:42px; height:42px; border:1px solid var(--line); border-radius:50%; background:#fff; color:#30324b; display:grid; place-items:center; cursor:pointer; transition:background 150ms, border-color 150ms, transform 150ms; }
  .bell-btn:hover{ background:var(--blue-soft); border-color:#cfd2ff; transform:translateY(-1px); }
  .body{ display:flex; flex:1; min-height:0; }
  .sidebar{ width:265px; border-right:1px solid var(--line); display:flex; flex-direction:column; background:#fff; }
  .brand-logo{ padding:30px 20px 24px; font-family:'Fraunces', serif; font-style:italic; font-weight:700; font-size:19px; color:#26346d; }
  .nav-title{ padding:0 20px 10px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:#9ca1b4; font-weight:800; }
  .sidebar-tools{ display:none; }
  .nav-stack{ padding:0 10px; display:flex; flex-direction:column; gap:8px; }
  .navbtn{ width:100%; border:none; border-left:4px solid transparent; border-radius:0; background:transparent; color:#4b5365; padding:14px 20px; display:flex; align-items:center; gap:14px; font-size:15px; font-weight:800; text-align:left; cursor:pointer; transition:background 150ms, color 150ms, border-color 150ms; }
  .navbtn svg{ width:20px; height:20px; color:currentColor; flex:0 0 auto; }
  .navbtn:hover{ background:#f7f5ff; color:#24314d; }
  .navbtn.active{ background:linear-gradient(90deg,#e5f3ee 0%,#f3edff 100%); color:#174f3f; border-left-color:#7b69ff; }
  .sidebar-bottom{ margin-top:auto; padding:12px 10px 16px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:10px; }
  .soft-pill{ border:none; border-radius:999px; background:#f3f1fb; color:#66677d; padding:14px 18px; display:flex; align-items:center; justify-content:center; gap:10px; font-weight:800; cursor:pointer; transition:background 150ms, transform 150ms; }
  .soft-pill:hover{ background:#ece9fa; transform:translateY(-1px); }
  .soft-pill svg{ width:18px; height:18px; }
  .list{ display:none; }
  .card{ display:none; }
  .stamp{ display:inline-flex; align-items:center; font-size:11px; font-weight:800; color:#5458ff; background:#f0efff; border-radius:999px; padding:5px 9px; }
  .empty-list{ padding:24px 20px; font-size:12.5px; color:var(--ink-dim); line-height:1.6; }
  .main{ flex:1; overflow-y:auto; padding:18px 30px 60px; background:#fff; }
  .page-shell{ max-width:1260px; margin:0 auto; }
  .hero{ min-height:146px; background:linear-gradient(90deg,#f1f1ff 0%,#f5f3ff 58%,#f1f1ff 100%); padding:48px 34px 28px; position:relative; display:flex; justify-content:space-between; align-items:flex-start; gap:22px; }
  .eyebrow{ color:#7b78ff; font-size:14px; letter-spacing:.06em; text-transform:uppercase; font-weight:900; margin-bottom:8px; }
  .hero h1{ margin:0; font-size:36px; line-height:1; letter-spacing:-.04em; font-weight:900; color:#142238; }
  .hero p{ margin:12px 0 0; color:#657184; font-size:16px; }
  .hero-actions{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  .count-pill{ background:#ebeaff; color:#6661ff; border-radius:999px; padding:8px 13px; font-size:13px; font-weight:900; text-transform:uppercase; }
  .action-btn{ border:none; border-radius:14px; color:#fff; padding:12px 16px; font-weight:900; display:inline-flex; align-items:center; gap:8px; cursor:pointer; min-width:102px; justify-content:center; transition:transform 150ms, filter 150ms; }
  .action-btn:hover{ transform:translateY(-1px); filter:brightness(.98); }
  .action-btn svg{ width:16px; height:16px; }
  .action-btn.add{ background:var(--green); }
  .action-btn.import{ background:var(--green-dark); }
  .pipeline-tools{ padding:56px 34px 26px; }
  .search-large{ width:420px; max-width:100%; height:43px; border:1px solid var(--line); border-radius:14px; padding:0 16px; font-size:16px; color:#394151; outline:none; transition:border-color 150ms, box-shadow 150ms; }
  .search-large:focus{ border-color:#b9bcff; box-shadow:0 0 0 4px rgba(95,99,255,.12); }
  .stage-tabs{ display:flex; gap:0; margin:38px 34px 16px; border-bottom:1px solid var(--line); }
  .stage-tab{ border:none; background:transparent; padding:0 18px 17px; color:#777; text-transform:uppercase; letter-spacing:.06em; font-size:14px; font-weight:900; cursor:pointer; border-bottom:2px solid transparent; }
  .stage-tab.active{ color:#5e5bff; border-bottom-color:#5e5bff; }
  .table-card{ margin:0 34px; border:1px solid var(--line); border-radius:0 0 18px 18px; overflow:hidden; box-shadow:var(--shadow-soft); background:#fff; max-width:100%; }
  .table-scroll{ overflow:auto; width:100%; }
  .pipeline-table{ width:100%; min-width:1120px; border-collapse:collapse; font-size:14px; }
  .pipeline-table th{ background:#f8faff; color:#3d4351; font-weight:800; text-align:left; padding:16px 18px; border-bottom:1px solid var(--line); white-space:nowrap; }
  .pipeline-table td{ padding:15px 18px; border-bottom:1px solid var(--line); color:#344054; vertical-align:middle; }
  .pipeline-table tr{ cursor:pointer; transition:background 150ms; }
  .pipeline-table tr:hover{ background:#fbfbff; }
  .pipeline-table .empty-row{ cursor:default; }
  .pipeline-table .empty-row:hover{ background:#fff; }
  .prio-dot{ width:10px; height:10px; border-radius:50%; background:#cfd5e5; display:inline-block; }
  .prio-dot.Alta{ background:#39a854; }
  .prio-dot.Media{ background:#f2b84b; }
  .prio-dot.Baja{ background:#9ca3af; }
  .horizontal-scroll{ height:8px; width:70%; background:#dadde1; margin:4px 0 0; }
  .start-upload{ max-width:720px; margin:42px auto; text-align:left; border:1px solid var(--line); border-radius:18px; background:#fff; padding:22px; box-shadow:var(--shadow-soft); }
  .start-upload h2{ font-family:var(--font-display); color:var(--ink); font-weight:900; margin:0 0 6px; font-size:28px; }
  .start-upload p{ margin:0 0 18px; color:var(--ink-dim); line-height:1.55; }
  .start-upload .upload-box{ margin-top:0; }
  .detail-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin:0 0 18px; padding:28px 30px; border:1px solid var(--line); border-left:5px solid var(--blue); border-radius:16px; background:#fff; box-shadow:var(--shadow-soft); }
  .detail-head input.name-input{ font-family:var(--font-display); font-size:28px; font-weight:900; border:none; background:transparent; color:var(--ink); width:100%; padding:0; }
  .detail-head input.name-input:focus{ outline:none; border-bottom:1px solid var(--blue);}
  .headbtns{ display:flex; gap:8px; flex-shrink:0; }
  .iconbtn{ font-family:var(--font-body); font-weight:900; font-size:12px; text-transform:uppercase; letter-spacing:.04em; padding:10px 14px; border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); cursor:pointer; transition:background 150ms, border-color 150ms; }
  .iconbtn:hover{ background:var(--blue-soft); border-color:#cfd2ff; }
  .iconbtn.danger{ border-color:var(--danger); color:var(--danger); }
  .iconbtn.danger:hover{ background:var(--danger); color:#fff; }
  .tabs{ display:flex; gap:8px; border-bottom:1px solid var(--line); margin:-4px 0 22px; }
  .tabbtn{ border:none; border-bottom:2px solid transparent; background:transparent; color:#777; padding:12px 16px; font-family:var(--font-body); font-weight:900; font-size:13px; text-transform:uppercase; letter-spacing:.04em; cursor:pointer; }
  .tabbtn:hover{ color:var(--ink); }
  .tabbtn.active{ color:var(--blue); border-bottom-color:var(--blue); }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }
  .section{ margin-bottom:26px; }
  .section .stitle{ font-family:var(--font-body); font-weight:900; font-size:13px; text-transform:uppercase; letter-spacing:.07em; color:var(--blue); border-bottom:1px solid var(--line); padding-bottom:8px; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
  .stitle .num{ color:#a7abff; font-weight:900; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:14px; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field.wide{ grid-column:1/-1; }
  .field label{ font-size:11px; color:var(--ink-dim); font-weight:600; }
  .field input, .field select, .field textarea{ padding:10px 11px; border:1px solid var(--line); border-radius:10px; background:#fff; font-family:var(--font-body); font-size:13.5px; color:var(--ink); resize:vertical; }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:#b9bcff; box-shadow:0 0 0 3px rgba(95,99,255,.10); }
  .field textarea{ min-height:64px; line-height:1.4; }
  .field.mono input{ font-family:var(--font-mono); }
  select{ appearance:none; }
  .upload-box{ border:1.5px dashed var(--line-strong); border-radius:14px; background:#fbfbff; padding:14px; margin-top:12px; }
  .upload-box.upload-disabled{ color:var(--ink-dim); font-size:12.5px; font-style:italic; }
  .upload-label{ display:block; font-size:11px; font-weight:600; color:var(--ink-dim); margin-bottom:8px; }
  .upload-row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .upload-row input[type=file]{ font-family:var(--font-body); font-size:12.5px; flex:1; min-width:180px; }
  .uploadbtn{ background:var(--green-dark); color:#fff; border:none; border-radius:12px; padding:10px 16px; font-family:var(--font-body); font-weight:900; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; cursor:pointer; transition:transform 150ms, filter 150ms; }
  .uploadbtn:hover{ transform:translateY(-1px); filter:brightness(.98); }
  .uploadbtn:disabled{ opacity:.6; cursor:wait; }
  .upload-msg{ margin-top:8px; font-size:12px; color:var(--glass-dim); font-family:var(--font-mono); }
  .doclist{ margin-top:14px; border-top:1px solid var(--line); padding-top:10px; }
  .docitem{ padding:8px 0; border-bottom:1px solid var(--line); font-size:12.5px; }
  .docitem:last-child{ border-bottom:none; }
  .doctag{ display:inline-block; font-family:var(--font-mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; background:var(--glass); color:#fff; padding:2px 6px; margin-right:8px; }
  .docname{ font-weight:600; margin-right:8px; }
  .docdate{ font-family:var(--font-mono); color:var(--ink-dim); font-size:11px; }
  .docresumen{ margin-top:4px; color:var(--ink-dim); font-size:12px; }
  .deal-summary{ display:grid; grid-template-columns:repeat(4, minmax(130px,1fr)); gap:10px; margin:0 0 16px; }
  .metric{ border:1px solid var(--line); border-radius:14px; background:#fff; padding:14px; box-shadow:var(--shadow-soft); }
  .metric .mlabel{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-dim); margin-bottom:6px; }
  .metric .mvalue{ font-family:var(--font-display); font-size:24px; font-weight:900; color:var(--green-dark); line-height:1; }
  .metric .msub{ font-family:var(--font-mono); font-size:10px; color:var(--ink-dim); margin-top:6px; }
  .verdict{ border:1px solid var(--line); border-left:5px solid var(--blue); border-radius:16px; background:#fff; padding:18px; margin:0 0 16px; display:grid; grid-template-columns:220px 1fr; gap:16px; align-items:start; box-shadow:var(--shadow-soft); }
  .verdict.good{ border-left-color:var(--green); }
  .verdict.watch{ border-left-color:#f2b84b; }
  .verdict.bad{ border-left-color:var(--danger); }
  .verdict-label{ font-family:var(--font-mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-dim); margin-bottom:8px; }
  .verdict-title{ font-family:var(--font-display); font-size:28px; line-height:1; margin:0 0 8px; }
  .verdict.good .verdict-title{ color:var(--green-dark); }
  .verdict.watch .verdict-title{ color:#b7791f; }
  .verdict.bad .verdict-title{ color:var(--danger); }
  .verdict p{ margin:0 0 6px; color:var(--ink-dim); line-height:1.5; font-size:13px; }
  .instrument-grid{ display:grid; grid-template-columns:repeat(4, minmax(130px,1fr)); gap:10px; margin-bottom:16px; }
  .instrument{ border:1px solid var(--line); border-radius:14px; background:#fff; padding:14px; box-shadow:var(--shadow-soft); }
  .instrument strong{ display:block; font-family:var(--font-mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; margin-bottom:8px; }
  .instrument .amount{ font-family:var(--font-display); font-size:22px; font-weight:900; color:var(--green-dark); }
  .bar{ height:8px; background:#f0f2f7; border:1px solid var(--line); border-radius:999px; margin-top:10px; overflow:hidden; }
  .bar span{ display:block; height:100%; background:var(--green); }
  .table-wrap{ overflow:auto; border:1px solid var(--line); border-radius:16px; background:#fff; box-shadow:var(--shadow-soft); }
  .data-table{ width:100%; border-collapse:collapse; min-width:760px; font-size:12px; }
  .data-table th{ background:#f8faff; color:#3d4351; font-family:var(--font-body); font-weight:800; font-size:12px; text-align:left; padding:12px; border-bottom:1px solid var(--line); }
  .data-table td{ padding:9px; border-bottom:1px solid var(--line); vertical-align:top; }
  .data-table td.num{ text-align:right; font-family:var(--font-mono); white-space:nowrap; }
  .pill{ display:inline-block; font-family:var(--font-mono); font-size:9px; letter-spacing:.05em; text-transform:uppercase; padding:3px 7px; border:1px solid currentColor; border-radius:999px; }
  .pill.good{ color:var(--glass); }
  .pill.watch{ color:var(--kraft); }
  .pill.bad{ color:var(--danger); }
  .plan-actions{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:0 0 16px; padding:12px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow-soft); }
  .plan-actions .primary-action{ background:var(--green); }
  .plan-actions .secondary-action{ background:var(--blue); }
  .plan-actions .quiet-action{ background:var(--paper); color:var(--ink); border:1px solid var(--ink); }
  .scenario-note{ border-left:4px solid var(--blue); background:#fbfbff; border-radius:0 12px 12px 0; padding:12px 14px; margin:0 0 16px; color:var(--ink-dim); font-size:12.5px; line-height:1.55; }
  .action-notice{ width:100%; border:1px solid #cfd2ff; background:#f4f5ff; color:#34377a; border-radius:12px; padding:10px 12px; font-size:12.5px; font-weight:800; }
  .hint{ font-size:12px; color:var(--ink-dim); line-height:1.5; }
  .crm-box{ border:1px solid var(--line); border-radius:16px; background:#fff; padding:14px; box-shadow:var(--shadow-soft); }
  .crm-add{ display:flex; gap:10px; align-items:flex-start; margin-bottom:14px; }
  .crm-add textarea{ flex:1; padding:8px 9px; border:1px solid var(--line); font-family:var(--font-body); font-size:13px; min-height:44px; resize:vertical; }
  .timeline{ display:flex; flex-direction:column; gap:0; }
  .tlitem{ display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:12.5px; align-items:baseline; flex-wrap:wrap; }
  .tlitem:last-child{ border-bottom:none; }
  .tldate{ font-family:var(--font-mono); font-size:11px; color:var(--ink-dim); min-width:78px; }
  .tltype{ font-family:var(--font-mono); font-size:9.5px; text-transform:uppercase; background:var(--tin); color:#fff; padding:1px 6px; }
  .tltype.tldoc{ background:var(--kraft); }
  .tltext{ flex:1; }
  .savebar{ position:sticky; bottom:0; background:rgba(255,255,255,.92); backdrop-filter:blur(10px); border-top:1px solid var(--line); padding:12px 0 0; margin-top:10px; display:flex; justify-content:space-between; align-items:center; font-family:var(--font-mono); font-size:11px; color:var(--ink-dim); }
  .savebtn{ background:var(--green); color:#fff; border:none; border-radius:12px; padding:12px 22px; font-family:var(--font-body); font-weight:900; font-size:12px; text-transform:uppercase; letter-spacing:.05em; cursor:pointer; }
  .savebtn:hover{ filter:brightness(.98); }
  .savebtn.saved{ background:var(--blue); }
  .assistant-fab{ position:fixed; right:34px; bottom:24px; width:58px; height:58px; border:none; border-radius:50%; background:#5d3ee6; color:#fff; display:grid; place-items:center; box-shadow:0 18px 35px rgba(93,62,230,.34); cursor:pointer; }
  .assistant-fab svg{ width:28px; height:28px; }
  ::-webkit-scrollbar{ width:9px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); }
  @media (max-width:760px){
    .topbar{ padding:0 14px; }
    .body{ flex-direction:column; }
    .sidebar{ width:100%; border-right:none; border-bottom:1px solid var(--line); }
    .brand-logo{ padding:18px 18px 10px; }
    .nav-stack{ flex-direction:row; overflow-x:auto; }
    .sidebar-bottom{ display:none; }
    .hero{ flex-direction:column; padding:30px 20px; }
    .hero-actions{ flex-direction:row; align-items:center; }
    .pipeline-tools, .stage-tabs{ margin-left:0; margin-right:0; padding-left:0; padding-right:0; }
    .table-card{ margin:0; }
    .deal-summary{ grid-template-columns:repeat(2, minmax(0,1fr)); }
    .instrument-grid{ grid-template-columns:repeat(2, minmax(0,1fr)); }
    .verdict{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  const STATUS_OPTS = ["Screening inicial","Contactada","NDA firmado","Info recibida","En análisis","LOI","Prioritaria","Descartada"];
  const STATUS_COLOR = {
    "Screening inicial":"var(--ink-dim)", "Contactada":"var(--tin)", "NDA firmado":"var(--tin-dim)",
    "Info recibida":"var(--glass-dim)", "En análisis":"var(--glass)", "LOI":"var(--kraft)",
    "Prioritaria":"var(--kraft)", "Descartada":"var(--danger)"
  };
  const SEGMENTOS = ["Rígidos plástico","Flexibles","Vidrio","Metal","Papel/Cartón","Multi-material","Bio/Compostable","Otro"];
  const PRIORIDADES = ["Alta","Media","Baja","Sin definir"];
  const TIPOS_DOCUMENTO = ["Teaser","Cuentas anuales","NDA","Informe comercial","CIM","Otro"];

  const FIELD_DEFS = {
    id:null, nombre:"", estado:"Screening inicial", prioridad:"Sin definir",
    pais_region:"", anio_fundacion:"", segmento:"", web:"", propietario:"", motivo_venta:"",
    facturacion_actual:"", facturacion_historico:"", ebitda:"", margen_ebitda:"", deuda_neta:"",
    multiplo_esperado:"", valoracion_estimada:"",
    empleados:"", plantas_capacidad:"", certificaciones:"", clientes_principales:"", concentracion_clientes:"",
    fortalezas:"", riesgos:"", sinergias:"",
    precio_acordado_vendedor:"", valor_empresa_tx:"", multiplo_transaccion:"", capital_a_usar:"", deuda_adquisicion:"",
    vendor_loan:"", venture_debt:"", earn_out:"", caja_objetivo:"", working_capital_objetivo:"",
    fees_transaccion:"", pct_equity:"", pct_deuda_bancaria:"", pct_vendor_loan:"", pct_venture_debt:"",
    tipo_deuda_bancaria:"", tipo_venture_debt:"", tipo_vendor_loan:"", conversion_ebitda_fcf:"",
    estructura_pago:"", condiciones_clave:"", riesgos_financiacion:"", capacidad_repago:"", tesis_impacto:"",
    escenario_adquisicion_guardado:"", loi_borrador:"",
    plan_adquisicion:"", plan_100_dias:"",
    fuente_contacto:"", fecha_ultimo_contacto:"", notas:"",
    proxima_accion:"", fecha_proxima_accion:"",
    analisis_ia:"",
    documentos:[], actividades:[]
  };
  let analyzing = false;
  let analyzeMsg = "";
  let docTipoSeleccionado = "Otro";
  let notaBorrador = "";

  let index = [];
  let current = null;
  let filterText = "";
  let filterEstado = "";
  let dirty = false;
  let activeTab = "screening";
  let viewMode = "company";
  let portfolio = [];
  let portfolioLoaded = false;
  let autoSaveTimer = null;

  function filenameToCompanyName(name){

  function parseNumber(value){
    const cleaned = (value || '').toString().replace(',', '.').match(/-?\d+(\.\d+)?/);
    return cleaned ? Number(cleaned[0]) : 0;
  }

  function parseOptionalNumber(value){
    const cleaned = (value || '').toString().replace(',', '.').match(/-?\d+(\.\d+)?/);
    return cleaned ? Number(cleaned[0]) : null;
  }

  function parsePercent(value, fallback){
    const n = parseOptionalNumber(value);
    return n === null ? fallback : n / 100;
  }

  function clamp(value, min, max){
    return Math.min(Math.max(value, min), max);
  }

  function formatNumber(value){
    if(!Number.isFinite(value) || value <= 0) return '';
    return value.toFixed(1).replace('.', ',');
  }

  function formatMoney(value){
    if(!Number.isFinite(value) || value < 0) return '';
    return value.toFixed(1).replace('.', ',');
  }

  function formatRatio(value){
    if(!Number.isFinite(value) || value <= 0) return '—';
    return value.toFixed(1).replace('.', ',') + 'x';
  }

  function formatPct(value){
    if(!Number.isFinite(value)) return '—';
    return (value * 100).toFixed(0).replace('.', ',') + '%';
  }

  function acquisitionModel(rec, opts){
    opts = opts || {};
    const ebitda = parseNumber(rec.ebitda);
    const revenue = parseNumber(rec.facturacion_actual);
    const multiple = parseNumber(rec.multiplo_transaccion || rec.multiplo_esperado) || 4;
    const sellerPrice = parseNumber(rec.precio_acordado_vendedor);
    const ev = sellerPrice || parseNumber(rec.valor_empresa_tx) || (ebitda ? ebitda * multiple : parseNumber(rec.valoracion_estimada));
    const netDebt = parseNumber(rec.deuda_neta);
    const equityValue = Math.max(ev - netDebt, 0);
    const purchasePrice = sellerPrice || equityValue || ev;
    const feeInput = parseOptionalNumber(rec.fees_transaccion);
    const fees = feeInput === null ? (purchasePrice ? purchasePrice * 0.025 : 0) : feeInput;
    const fundingNeed = Math.max(purchasePrice + fees, 0);
    const pctEquity = parsePercent(rec.pct_equity, 0.35);
    const pctBank = parsePercent(rec.pct_deuda_bancaria, 0.35);
    const pctVendor = parsePercent(rec.pct_vendor_loan, 0.20);
    const pctVenture = parsePercent(rec.pct_venture_debt, 0.10);
    const equity = opts.forcePercentages ? fundingNeed * pctEquity : (parseNumber(rec.capital_a_usar) || fundingNeed * pctEquity);
    const bankDebt = opts.forcePercentages ? fundingNeed * pctBank : (parseNumber(rec.deuda_adquisicion) || fundingNeed * pctBank);
    const vendorLoan = opts.forcePercentages ? fundingNeed * pctVendor : (parseNumber(rec.vendor_loan) || fundingNeed * pctVendor);
    const ventureDebt = opts.forcePercentages ? fundingNeed * pctVenture : (parseNumber(rec.venture_debt) || fundingNeed * pctVenture);
    const bankRate = parsePercent(rec.tipo_deuda_bancaria, 0.08);
    const ventureRate = parsePercent(rec.tipo_venture_debt, 0.12);
    const vendorRate = parsePercent(rec.tipo_vendor_loan, 0.05);
    const fcfConversion = parsePercent(rec.conversion_ebitda_fcf, 0.45);
    const fcf = ebitda * fcfConversion;
    const cashInterest = bankDebt * bankRate + ventureDebt * ventureRate;
    const pikInterest = vendorLoan * vendorRate;
    const totalDebt = bankDebt + ventureDebt + vendorLoan;
    const seniorDebt = bankDebt + ventureDebt;
    const leverageSenior = ebitda ? seniorDebt / ebitda : 0;
    const leverageTotal = ebitda ? totalDebt / ebitda : 0;
    const icr = cashInterest ? ebitda / cashInterest : 99;
    const fcfAfterInterest = Math.max(fcf - cashInterest, 0);
    const paybackYears = fcfAfterInterest ? seniorDebt / fcfAfterInterest : 99;
    const totalDebtPaybackYears = fcfAfterInterest ? totalDebt / fcfAfterInterest : 99;
    const totalSources = equity + bankDebt + vendorLoan + ventureDebt;
    const fundingGap = fundingNeed - totalSources;
    const fundingGapAbs = Math.abs(fundingGap);
    let level = 'good';
    let verdict = 'Financiable';
    if(!ebitda || !ev){ level = 'watch'; verdict = 'Datos insuficientes'; }
    else if(fundingGap > 0.05){ level = 'watch'; verdict = 'Escenario incompleto'; }
    else if(leverageSenior > 3.0 || icr < 2.0 || paybackYears > 6){ level = 'bad'; verdict = 'No repaga con confort'; }
    else if(leverageSenior > 2.25 || icr < 3.0 || paybackYears > 4.5 || leverageTotal > 4.0){ level = 'watch'; verdict = 'Financiable con estructura defensiva'; }
    const reasons = [];
    if(fundingGap > 0.05) reasons.push(`Faltan ${formatNumber(fundingGap)} M€ de fuentes para cubrir precio y fees.`);
    if(fundingGap < -0.05) reasons.push(`Sobran ${formatNumber(fundingGapAbs)} M€ de fuentes; reduce porcentajes o baja equity.`);
    if(ebitda) reasons.push(`Senior debt/EBITDA ${formatRatio(leverageSenior)} y deuda total/EBITDA ${formatRatio(leverageTotal)}.`);
    if(cashInterest) reasons.push(`ICR estimado ${formatRatio(icr)}; FCF post-intereses repaga la deuda bancaria/venture en ${paybackYears >= 90 ? 'más de 7' : paybackYears.toFixed(1).replace('.', ',')} años.`);
    if(vendorLoan) reasons.push(`Vendor loan ${formatNumber(vendorLoan)} M€ absorbe presión de caja inicial, pero acumula riesgo de refinanciación/negociación con vendedor.`);
    if(!ebitda || !ev) reasons.push('Faltan EBITDA normalizado o EV para emitir un juicio robusto.');
    return { ebitda, revenue, multiple, ev, sellerPrice, equityValue, purchasePrice, netDebt, fees, fundingNeed, totalSources, fundingGap, fundingGapAbs, equity, bankDebt, vendorLoan, ventureDebt, bankRate, ventureRate, vendorRate, fcfConversion, fcf, cashInterest, pikInterest, fcfAfterInterest, totalDebt, seniorDebt, leverageSenior, leverageTotal, icr, paybackYears, totalDebtPaybackYears, level, verdict, reasons };
  }

  function scoreScenario(model){
    const equityWeight = model.fundingNeed ? model.equity / model.fundingNeed : 1;
    const repaymentPenalty = model.paybackYears > 5 ? (model.paybackYears - 5) * 12 : 0;
    const leveragePenalty = model.leverageSenior > 2.5 ? (model.leverageSenior - 2.5) * 20 : 0;
    const icrPenalty = model.icr < 3 ? (3 - model.icr) * 18 : 0;
    const vendorPenalty = model.fundingNeed ? (model.vendorLoan / model.fundingNeed) * 4 : 0;
    return equityWeight * 100 + repaymentPenalty + leveragePenalty + icrPenalty + vendorPenalty;
  }

  function optimizeAcquisitionStructure(baseRec){
    const candidates = [];
    const fallbackCandidates = [];
    const equityOptions = [0.20,0.25,0.30,0.35,0.40,0.45,0.50,0.55,0.60];
    const bankOptions = [0.15,0.20,0.25,0.30,0.35,0.40,0.45];
    const ventureOptions = [0,0.05,0.10,0.15];
    equityOptions.forEach(eq=>{
      bankOptions.forEach(bank=>{
        ventureOptions.forEach(venture=>{
          const vendor = 1 - eq - bank - venture;
          if(vendor < 0 || vendor > 0.35) return;
          const rec = Object.assign({}, baseRec, {
            capital_a_usar:'', deuda_adquisicion:'', venture_debt:'', vendor_loan:'',
            pct_equity:String(Math.round(eq*100)),
            pct_deuda_bancaria:String(Math.round(bank*100)),
            pct_venture_debt:String(Math.round(venture*100)),
            pct_vendor_loan:String(Math.round(vendor*100))
          });
          const model = acquisitionModel(rec, { forcePercentages:true });
          if(!model.ebitda || !model.ev) return;
          if(Math.abs(model.fundingGap) > 0.05 || model.level === 'bad') return;
          const scored = { rec, model, score:scoreScenario(model) };
          fallbackCandidates.push(scored);
          if(model.icr >= 2.5 && model.paybackYears <= 5 && model.leverageSenior <= 2.6 && model.leverageTotal <= 4.0){
            candidates.push(scored);
          }
        });
      });
    });
    const pool = candidates.length ? candidates : fallbackCandidates;
    pool.sort((a,b)=>a.score-b.score);
    return pool[0] || null;
  }

  function debtSchedule(model){
    const rows = [];
    let seniorDebt = model.seniorDebt;
    let vendorDebt = model.vendorLoan;
    const fcfBeforeDebt = model.fcf;
    const seniorRate = model.seniorDebt ? ((model.bankDebt * model.bankRate) + (model.ventureDebt * model.ventureRate)) / model.seniorDebt : 0;
    for(let year=1; year<=7; year++){
      const openingSenior = seniorDebt;
      const openingVendor = vendorDebt;
      const openingTotal = openingSenior + openingVendor;
      const cashInterest = openingSenior * seniorRate;
      const cashAfterInterest = Math.max(fcfBeforeDebt - cashInterest, 0);
      const seniorAmort = Math.min(openingSenior, cashAfterInterest);
      const cashAfterSenior = Math.max(cashAfterInterest - seniorAmort, 0);
      const vendorInterest = openingVendor * model.vendorRate;
      const vendorWithInterest = openingVendor + vendorInterest;
      const vendorAmort = Math.min(vendorWithInterest, cashAfterSenior);
      seniorDebt = Math.max(openingSenior - seniorAmort, 0);
      vendorDebt = Math.max(vendorWithInterest - vendorAmort, 0);
      const debtService = cashInterest + seniorAmort + vendorAmort;
      rows.push({
        year,
        openingSenior,
        openingVendor,
        openingTotal,
        fcfBeforeDebt,
        cashInterest,
        seniorAmort,
        vendorInterest,
        vendorAmort,
        closingSenior: seniorDebt,
        closingVendor: vendorDebt,
        closingTotal: seniorDebt + vendorDebt,
        leverage: model.ebitda ? seniorDebt / model.ebitda : 0,
        dscr: debtService ? fcfBeforeDebt / debtService : null
      });
    }
    return rows;
  }

  function renderDebtScheduleTab(){
    const model = acquisitionModel(current, { forcePercentages:true });
    const rows = debtSchedule(model);
    const seniorClearYear = rows.find(r=>r.closingSenior <= 0.05)?.year;
    const totalClearYear = rows.find(r=>r.closingTotal <= 0.05)?.year;
    const residual = rows.length ? rows[rows.length - 1].closingTotal : 0;
    const dscrValues = rows.map(row=>row.dscr).filter(Number.isFinite);
    const minDscr = dscrValues.length ? Math.min(...dscrValues) : null;
    const tableRows = rows.map(row=>`<tr>
      <td>${row.year}</td>
      <td class="num">${formatMoney(row.openingTotal) || '0,0'} M€</td>
      <td class="num">${formatMoney(row.fcfBeforeDebt) || '0,0'} M€</td>
      <td class="num">${formatMoney(row.cashInterest) || '0,0'} M€</td>
      <td class="num">${formatMoney(row.seniorAmort) || '0,0'} M€</td>
      <td class="num">${formatMoney(row.vendorInterest) || '0,0'} M€</td>
      <td class="num">${formatMoney(row.vendorAmort) || '0,0'} M€</td>
      <td class="num">${formatMoney(row.closingTotal) || '0,0'} M€</td>
      <td class="num">${formatRatio(row.leverage)}</td>
      <td class="num">${formatRatio(row.dscr)}</td>
    </tr>`).join('');
    return `
      <div class="section">
        <div class="stitle"><span class="num">D1</span> Cuadro de devolución de deuda</div>
        <div class="scenario-note"><strong>Criterio de cálculo:</strong> parte del precio y porcentajes actuales. El FCF antes de deuda se estima como EBITDA × conversión a FCF. Primero se pagan intereses cash de deuda senior, después se amortiza deuda bancaria/venture y, cuando sobra caja, se amortiza vendor loan. El vendor loan acumula interés hasta amortizarse.</div>
        <div class="deal-summary">
          ${metric('FCF antes deuda', formatMoney(model.fcf) ? formatMoney(model.fcf) + ' M€' : '', `Conversión ${formatPct(model.fcfConversion)}`)}
          ${metric('Deuda inicial', formatMoney(model.totalDebt) ? formatMoney(model.totalDebt) + ' M€' : '0,0 M€', 'Banco + venture + vendor')}
          ${metric('Senior repagada', seniorClearYear ? 'Año ' + seniorClearYear : '>7 años', 'Banco + venture')}
          ${metric('Deuda residual año 7', formatMoney(residual) + ' M€', totalClearYear ? 'Deuda total repagada año ' + totalClearYear : 'Pendiente refinanciar/negociar')}

          ${metric('Leverage inicial', formatRatio(model.leverageTotal), 'Deuda total / EBITDA')}
          ${metric('Equity cheque', formatMoney(model.equity) ? formatMoney(model.equity) + ' M€' : '', `${formatPct(model.fundingNeed ? model.equity/model.fundingNeed : 0)} de fuentes`)}
          ${metric('Fuentes vs necesidad', model.fundingGap > 0.05 ? 'Faltan ' + formatMoney(model.fundingGap) + ' M€' : model.fundingGap < -0.05 ? 'Sobran ' + formatMoney(model.fundingGapAbs) + ' M€' : 'Cuadrado', formatMoney(model.fundingNeed) ? 'Necesidad ' + formatMoney(model.fundingNeed) + ' M€' : '')}

        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>Año</th><th>Deuda inicial</th><th>FCF antes deuda</th><th>Intereses cash</th><th>Amort. senior</th><th>Interés vendor</th><th>Amort. vendor</th><th>Deuda final</th><th>Senior/EBITDA</th><th>DSCR</th></tr></thead>
            <tbody>${tableRows}</tbody>
          </table>
        </div>
      </div>
    `;
  }

  function metric(label, value, sub){
    return `<div class="metric"><div class="mlabel">${label}</div><div class="mvalue">${escapeHtml(value || '—')}</div>${sub ? `<div class="msub">${escapeHtml(sub)}</div>` : ''}</div>`;
  }

  function field(key, label, opts){
    opts = opts || {};
    const val = escapeHtml(current[key] || '');
    const wide = opts.wide ? ' wide' : '';
    const mono = opts.mono ? ' mono' : '';
    const id = 'field-' + key;
    if(opts.type==='select'){
      return `<div class="field${wide}">
        <label for="${id}">${label}</label>
        <select id="${id}" data-key="${key}">
          ${(opts.options||[]).map(o=>`<option value="${escapeHtml(o)}" ${current[key]===o?'selected':''}>${o}</option>`).join('')}
        </select>
      </div>`;
    }
    if(opts.type==='textarea'){
      return `<div class="field${wide}">
        <label for="${id}">${label}</label>
        <textarea id="${id}" data-key="${key}" placeholder="${opts.placeholder||''}">${val}</textarea>
      </div>`;
    }
    return `<div class="field${wide}${mono}">
      <label for="${id}">${label}</label>
      <input id="${id}" data-key="${key}" type="text" value="${val}" placeholder="${opts.placeholder||''}"/>
    </div>`;
  }

  async function analyzeFileForCurrent(file, tipo){
    docTipoSeleccionado = tipo;
    analyzing = true;
    analyzeMsg = '';
    renderMain();
    try{
      const fd = new FormData();
      fd.append('file', file);
      fd.append('tipo', docTipoSeleccionado);
      const r = await fetch('/api/companies/' + current.id + '/analyze-document', { method:'POST', body: fd });
      const data = await r.json();
      if(!r.ok){
        analyzeMsg = 'Error: ' + (data.message || 'no se pudo analizar el archivo.');
      } else {
        current = Object.assign({}, FIELD_DEFS, data);
        analyzeMsg = 'Análisis completado — revisa y ajusta los campos si hace falta.';
        await loadIndex();
      }
    }catch(e){
      analyzeMsg = 'Error de conexión al analizar el archivo.';
    }
    analyzing = false;
    renderMain();
  }

    current.condiciones_clave = current.condiciones_clave || 'QoE con EBITDA normalizado, puente deuda neta/caja, working capital target, capex de mantenimiento, concentración de clientes, permisos/certificaciones alimentarias y confirmación de churn/márgenes por producto.';
    current.riesgos_financiacion = `Riesgo principal: ${model.level==='good' ? 'la estructura es razonable, pero depende de que el EBITDA convierta en caja y no requiera capex extraordinario.' : model.level==='watch' ? 'la caja queda ajustada; exigir menor deuda inicial, cash sweep, vendor loan más largo o precio contingente.' : 'la empresa no soporta el apalancamiento propuesto; bajar precio o sustituir deuda por equity/earn-out.'}`;
    current.capacidad_repago = `${model.verdict}. ${model.reasons.join(' ')}`;

  function applyModelToCurrent(model){
    current.valor_empresa_tx = formatNumber(model.ev);

    current.venture_debt = formatNumber(model.ventureDebt);
    current.vendor_loan = formatNumber(model.vendorLoan);
    if(!current.fees_transaccion && model.fees) current.fees_transaccion = formatNumber(model.fees);

  function handleOptimizeStructure(){
    if(!current.precio_acordado_vendedor && current.valor_empresa_tx) current.precio_acordado_vendedor = current.valor_empresa_tx;
    ensureScenarioInputs();
    const best = optimizeAcquisitionStructure(current);
    if(!best){
      const model = acquisitionModel(current);
      current.riesgos_financiacion = `No hay una estructura conservadora que repague con los datos actuales. Recomendación: renegociar precio, subir equity, ampliar vendor loan/earn-out o exigir más EBITDA normalizado antes de LOI. Diagnóstico actual: ${model.reasons.join(' ')}`;
      current.capacidad_repago = `${model.verdict}. ${model.reasons.join(' ')}`;
      finishAction('No hay estructura cómoda con estos datos. He dejado el diagnóstico en Riesgos de financiación.', 'field-riesgos_financiacion');
      return;
    }
    current.pct_equity = best.rec.pct_equity;
    current.pct_deuda_bancaria = best.rec.pct_deuda_bancaria;
    current.pct_venture_debt = best.rec.pct_venture_debt;
    current.pct_vendor_loan = best.rec.pct_vendor_loan;
    applyModelToCurrent(best.model);
    current.estructura_pago = `Estructura optimizada para minimizar equity sin romper repago: ${current.pct_equity}% equity, ${current.pct_deuda_bancaria}% deuda bancaria LBO, ${current.pct_venture_debt}% venture debt y ${current.pct_vendor_loan}% vendor loan. Prioriza deuda cash-pay solo hasta mantener ICR y repago senior razonables; el vendor loan absorbe parte del precio sin tensionar caja inicial.`;
    current.capacidad_repago = `${best.model.verdict}. ${best.model.reasons.join(' ')}`;
    current.riesgos_financiacion = `La estructura elegida es la mejor dentro de los límites de repago configurados. Sensibilidades críticas: caída de EBITDA, menor conversión a FCF, capex de mantenimiento superior y retraso en sinergias. Si cualquiera aparece en QoE, reducir deuda bancaria/venture y desplazar precio a vendor loan o earn-out.`;
    current.plan_adquisicion = `Mejor opción automática a partir del precio acordado: precio a financiar ${formatNumber(best.model.purchasePrice)} M€ y necesidad total ${formatNumber(best.model.fundingNeed)} M€ incluyendo fees, con equity ${formatNumber(best.model.equity)} M€, deuda bancaria ${formatNumber(best.model.bankDebt)} M€, venture debt ${formatNumber(best.model.ventureDebt) || '0,0'} M€ y vendor loan ${formatNumber(best.model.vendorLoan) || '0,0'} M€. Senior leverage ${formatRatio(best.model.leverageSenior)}, total leverage ${formatRatio(best.model.leverageTotal)}, ICR ${formatRatio(best.model.icr)} y repago senior estimado ${best.model.paybackYears.toFixed(1).replace('.', ',')} años. Recomendación: avanzar a LOI condicionada a QoE, deuda neta, working capital normalizado y confirmación de FCF.`;
    current.escenario_adquisicion_guardado = buildSavedScenario(best.model);
    finishAction('Estructura ideal calculada y escenario guardado para comité.', 'field-plan_adquisicion');
  }

s materiales; y (vii) aprobación final de financiación.\n\n4. Due diligence y exclusividad\nSolicitamos un periodo de exclusividad de 60 días naturales desde la firma de esta carta, durante el cual la Sociedad facilitará acceso razonable a información financiera, fiscal, legal, comercial, operativa y medioambiental.\n\n5. Carácter no vinculante\nSalvo las obligaciones de confidencialidad, exclusividad, costes y ley aplicable que se pacten expresamente, esta carta no constituye una oferta vinculante ni obligación de completar la transacción. Cualquier obligación definitiva quedará sujeta a la firma de un contrato de compraventa.\n\n6. Racional estratégico\nNuestra tesis se basa en ${current.tesis_impacto || current.sinergias || 'la integración de la Sociedad en una plataforma de roll-up de envases alimentarios, capturando sinergias comerciales, operativas y de compras, preservando el equipo gestor y la relación con clientes clave'}.\n\nAtentamente,\n\n[Comprador]\n[Cargo]\n`;

  function renderPortfolioTab(){
    if(!portfolioLoaded){
      return `<div class="section"><div class="stitle"><span class="num">P1</span> Tesis consolidada</div><div class="empty-list" style="padding:18px 0;">Cargando información completa de las empresas...</div></div>`;

    const totals = models.reduce((acc, row)=>{
      acc.ev += row.model.ev || 0;
      acc.revenue += row.model.revenue || 0;
      acc.ebitda += row.model.ebitda || 0;
      acc.equity += row.model.equity || 0;
      acc.bankDebt += row.model.bankDebt || 0;
      acc.ventureDebt += row.model.ventureDebt || 0;
      acc.vendorLoan += row.model.vendorLoan || 0;
      acc.seniorDebt += row.model.seniorDebt || 0;
      acc.totalDebt += row.model.totalDebt || 0;
      return acc;
    }, {ev:0,revenue:0,ebitda:0,equity:0,bankDebt:0,ventureDebt:0,vendorLoan:0,seniorDebt:0,totalDebt:0});

    const totalLeverage = totals.ebitda ? totals.totalDebt / totals.ebitda : 0;
    const good = models.filter(r=>r.model.level==='good').length;
    const watch = models.filter(r=>r.model.level==='watch').length;
    const bad = models.filter(r=>r.model.level==='bad').length;
    const verdict = bad ? 'Tesis bajo presión' : watch ? 'Tesis defendible con disciplina' : 'Tesis financieramente limpia';
    const verdictClass = bad ? 'bad' : watch ? 'watch' : 'good';
    const segmentMap = {};
    activeCompanies.forEach(c=>{ segmentMap[c.segmento || 'Sin segmento'] = (segmentMap[c.segmento || 'Sin segmento'] || 0) + 1; });
    const segmentText = Object.entries(segmentMap).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k}: ${v}`).join(' · ') || 'Sin empresas activas';
    return `
      <div class="section">
        <div class="stitle"><span class="num">P1</span> Lectura de comité</div>
        <div class="verdict ${verdictClass}">
          <div>
            <div class="verdict-label">Tesis consolidada</div>
            <h3 class="verdict-title">${escapeHtml(verdict)}</h3>
            <p>${bad ? 'Hay targets cuya estructura no repaga con comodidad. La tesis debe priorizar renegociación de precio, más equity o vendor support antes de avanzar.' : watch ? 'La cartera puede funcionar, pero la creación de valor depende de disciplina de entrada, sinergias reales y control de deuda.' : 'La cartera muestra una base razonable para una plataforma apalancada, pendiente de QoE y confirmación de caja.'}</p>
          </div>
          <div>
            <p>Mapa de segmentos: ${escapeHtml(segmentText)}.</p>
            <p>Semáforo de repago: ${good} financiables, ${watch} en vigilancia, ${bad} no cómodas.</p>
            <p>Apalancamiento consolidado senior ${formatRatio(seniorLeverage)} y total ${formatRatio(totalLeverage)} sobre EBITDA agregado. Los importes se recalculan desde los porcentajes vigentes de cada ficha.</p>
          </div>
        </div>
        <div class="deal-summary">
          ${metric('Empresas activas', String(activeCompanies.length), 'Excluye descartadas')}
          ${metric('Facturación agregada', formatNumber(totals.revenue) ? formatNumber(totals.revenue) + ' M€' : '', 'Último año')}
          ${metric('EBITDA agregado', formatNumber(totals.ebitda) ? formatNumber(totals.ebitda) + ' M€' : '', consolidatedMarginLabel)}
          ${metric('EV agregado', formatNumber(totals.ev) ? formatNumber(totals.ev) + ' M€' : '', 'Targets con datos')}
        </div>
        ${renderInstrumentGrid({ fundingNeed: totals.equity + totals.bankDebt + totals.ventureDebt + totals.vendorLoan, equity: totals.equity, bankDebt: totals.bankDebt, ventureDebt: totals.ventureDebt, vendorLoan: totals.vendorLoan, bankRate:0.08, ventureRate:0.12, vendorRate:0.05 })}
      </div>

      <div class="section">
        <div class="stitle"><span class="num">P2</span> Matriz de targets e impacto en tesis</div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>Empresa</th><th>Segmento</th><th>Estado</th><th>Repago</th><th>EV</th><th>EBITDA</th><th>Senior lev.</th><th>ICR</th><th>Impacto en tesis</th></tr></thead>
            <tbody>
              ${models.length ? models.map(row=>`<tr>
                <td><strong>${escapeHtml(row.company.nombre || '(sin nombre)')}</strong></td>
                <td>${escapeHtml(row.company.segmento || '—')}</td>
                <td>${escapeHtml(row.company.estado || '—')}</td>
                <td><span class="pill ${row.model.level}">${escapeHtml(row.model.verdict)}</span></td>
                <td class="num">${formatNumber(row.model.ev) || '—'} M€</td>
                <td class="num">${formatNumber(row.model.ebitda) || '—'} M€</td>
                <td class="num">${formatRatio(row.model.leverageSenior)}</td>
                <td class="num">${formatRatio(row.model.icr)}</td>
                <td>${escapeHtml(row.company.tesis_impacto || row.company.sinergias || row.company.fortalezas || 'Pendiente de redactar en el plan de adquisición.')}</td>
              </tr>`).join('') : `<tr><td colspan="9">No hay empresas activas para consolidar.</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  function pipelineStage(record){
    if(record.estado === 'Descartada') return 'discarded';
    if(record.estado === 'Screening inicial' || record.estado === 'Contactada') return 'backlog';
    return 'study';
  }

  function renderDealflowView(){
    const stageFilter = filterEstado || 'study';
    const rows = index.filter(e=>{
      const matchText = !filterText || (e.nombre||'').toLowerCase().includes(filterText.toLowerCase()) || (e.segmento||'').toLowerCase().includes(filterText.toLowerCase());
      const matchEstado = pipelineStage(e) === stageFilter;
      return matchText && matchEstado;
    }).sort((a,b)=> (b.updated||'').localeCompare(a.updated||''));
    const counts = index.reduce((acc, rec)=>{
      acc[pipelineStage(rec)] += 1;
      return acc;
    }, {study:0, backlog:0, discarded:0});
    return `
      <div class="page-shell">
        <div class="hero">
          <div>
            <div class="eyebrow">Valoración · Empresas</div>
            <h1>DealFlow</h1>
            <p>Listado de empresas a valorar.</p>
          </div>
          <div class="hero-actions">
            <div class="count-pill">${index.length} empresas</div>
            <button class="action-btn add" id="newBtn" type="button">${icon('plus')} Añadir</button>
            <button class="action-btn import" id="importBtn" type="button">${icon('import')} Importar</button>
            <input type="file" id="startDocFile" accept=".pdf,.xlsx,.xls,.csv" hidden/>
            <select id="startDocTipo" hidden>${TIPOS_DOCUMENTO.map(t=>`<option value="${t}" ${docTipoSeleccionado===t?'selected':''}>${t}</option>`).join('')}</select>
          </div>
        </div>

        <div class="pipeline-tools">
          <input class="search-large" id="search" type="text" placeholder="Buscar por nombre o CIF..." value="${escapeHtml(filterText)}"/>
        </div>

        <div class="stage-tabs">
          <button class="stage-tab ${stageFilter==='study'?'active':''}" data-stage="study" type="button">En estudio (${counts.study})</button>
          <button class="stage-tab ${filterEstado==='backlog'?'active':''}" data-stage="backlog" type="button">En backlog (${counts.backlog})</button>
          <button class="stage-tab ${filterEstado==='discarded'?'active':''}" data-stage="discarded" type="button">Descartados (${counts.discarded})</button>
        </div>

        <div class="table-card">
          <div class="table-scroll">
            <table class="pipeline-table">
              <thead>
                <tr>
                  <th>Prio.</th><th>Empresa / marca</th><th>Provincia</th><th>CCAA</th><th>Modelo</th><th>CNAE</th><th>Dato financiero</th><th>EBITDA</th><th>Estado</th>
                </tr>
              </thead>
              <tbody>
                ${rows.length ? rows.map(row=>`<tr data-id="${row.id}">
                  <td><span class="prio-dot ${escapeHtml(row.prioridad || '')}"></span></td>
                  <td><strong>${escapeHtml(row.nombre || '(sin nombre)')}</strong></td>
                  <td>${escapeHtml(row.pais_region || '—')}</td>
                  <td>${escapeHtml(row.segmento || '—')}</td>
                  <td>${escapeHtml(row.propietario || '—')}</td>
                  <td>${escapeHtml(row.web || '—')}</td>
                  <td>${escapeHtml(row.facturacion_actual ? row.facturacion_actual + ' M€ fact.' : '—')}</td>
                  <td>${escapeHtml(row.ebitda ? row.ebitda + ' M€' : '—')}</td>
                  <td><span class="stamp">${escapeHtml(row.estado || '—')}</span></td>
                </tr>`).join('') : `<tr class="empty-row"><td colspan="9">No records to display.</td></tr>`}
              </tbody>
            </table>
          </div>
          <div class="horizontal-scroll"></div>
        </div>
      </div>
    `;
  }

  function renderMain(){
    const main = document.getElementById('main');
    if(viewMode === 'portfolio'){
      main.innerHTML = renderPortfolioTab();
      return;
    }
    if(!current){
      main.innerHTML = renderDealflowView();
      document.getElementById('search').addEventListener('input', e=>{ filterText=e.target.value; renderMain(); });
      document.querySelectorAll('.stage-tab').forEach(btn=>{
        btn.addEventListener('click', e=>{ filterEstado = e.currentTarget.dataset.stage; renderMain(); });
      });
      document.getElementById('newBtn').addEventListener('click', createNew);
      const importBtn = document.getElementById('importBtn');
      const fileInput = document.getElementById('startDocFile');
      importBtn.addEventListener('click', ()=>fileInput.click());
      fileInput.addEventListener('change', handleFirstDocumentUpload);
      main.querySelectorAll('.pipeline-table tbody tr[data-id]').forEach(row=>{
        row.addEventListener('click', ()=>openCompany(row.dataset.id));
      });
      return;
    }
    main.innerHTML = `
      <div class="detail-head">
        <input class="name-input" id="nameInput" type="text" value="${escapeHtml(current.nombre)}" placeholder="Nombre de la empresa"/>
        <div class="headbtns">
          <button class="iconbtn danger" id="delBtn">Eliminar</button>
        </div>
      </div>

      <div class="tabs">
        <button class="tabbtn ${activeTab==='screening'?'active':''}" data-tab="screening">Ficha de screening</button>
        <button class="tabbtn ${activeTab==='acquisition'?'active':''}" data-tab="acquisition">Plan de adquisición</button>
        <button class="tabbtn ${activeTab==='debt'?'active':''}" data-tab="debt">Cuadro de deuda</button>
      </div>

      <div class="tab-panel ${activeTab==='screening'?'active':''}">

      <div class="section">
        <div class="stitle"><span class="num">01</span> Identificación</div>
        <div class="grid">
          ${field('pais_region','País / región', {placeholder:'ej. Cataluña, España'})}
          ${field('anio_fundacion','Año de fundación', {mono:true})}
          ${field('segmento','Segmento', {type:'select', options:SEGMENTOS})}
          ${field('web','Web', {placeholder:'https://'})}
          ${field('propietario','Propietario / accionariado', {wide:true, placeholder:'Familiar, PE, fundador único...'})}
          ${field('motivo_venta','Motivo de venta', {wide:true, placeholder:'Sucesión, jubilación, desinversión de fondo...'})}
        </div>
      </div>

      <div class="section">
        <div class="stitle"><span class="num">02</span> Financieros</div>
        <div class="grid">
          ${field('facturacion_actual','Facturación último año (M€)', {mono:true})}
          ${field('ebitda','EBITDA (M€)', {mono:true})}
          ${field('margen_ebitda','Margen EBITDA (%)', {mono:true})}
          ${field('deuda_neta','Deuda neta (M€)', {mono:true})}
          ${field('multiplo_esperado','Múltiplo esperado (x EBITDA)', {mono:true})}
          ${field('valoracion_estimada','Valoración estimada (M€)', {mono:true})}
          ${field('facturacion_historico','Histórico facturación (últimos 3 años)', {wide:true, type:'textarea', placeholder:'2023: ... / 2024: ... / 2025: ...'})}
        </div>
      </div>

      <div class="section">
        <div class="stitle"><span class="num">03</span> Operativa</div>
        <div class="grid">
          ${field('empleados','Nº empleados', {mono:true})}
          ${field('concentracion_clientes','Concentración top-3 clientes (%)', {mono:true})}
          ${field('plantas_capacidad','Plantas y capacidad productiva', {wide:true, type:'textarea'})}
          ${field('certificaciones','Certificaciones (BRC, IFS, FSC, ISO 22000...)', {wide:true})}
          ${field('clientes_principales','Clientes principales', {wide:true, type:'textarea'})}
        </div>
      </div>

      <div class="section">
        <div class="stitle"><span class="num">04</span> Estrategia</div>
        <div class="grid">
          ${field('fortalezas','Fortalezas', {wide:true, type:'textarea'})}
          ${field('riesgos','Riesgos / red flags', {wide:true, type:'textarea'})}
          ${field('sinergias','Sinergias potenciales con la plataforma', {wide:true, type:'textarea'})}
        </div>
      </div>

      <div class="section">
        <div class="stitle"><span class="num">05</span> Estado y seguimiento</div>
        <div class="grid">
          ${field('estado','Estado', {type:'select', options:STATUS_OPTS})}
          ${field('prioridad','Prioridad', {type:'select', options:PRIORIDADES})}
          ${field('fuente_contacto','Fuente / contacto del deal', {placeholder:'Banquero, referido, inbound...'})}
          ${field('fecha_ultimo_contacto','Fecha último contacto', {mono:true, placeholder:'AAAA-MM-DD'})}
          ${field('proxima_accion','Próxima acción', {wide:true, placeholder:'Ej. Pedir cuentas 2025, agendar llamada...'})}
          ${field('fecha_proxima_accion','Fecha próxima acción', {mono:true, placeholder:'AAAA-MM-DD'})}
          ${field('notas','Notas libres', {wide:true, type:'textarea'})}
        </div>
      </div>

      <div class="section">
        <div class="stitle"><span class="num">06</span> Documentos y análisis IA</div>
        ${renderDocumentsBox()}
        <div class="grid" style="margin-top:14px;">
          ${field('analisis_ia','Histórico de insights IA', {wide:true, type:'textarea', placeholder:'Sube un documento arriba para generar insights automáticamente. Cada análisis se añade aquí con fecha.'})}
        </div>
      </div>

      <div class="section">
        <div class="stitle"><span class="num">07</span> Seguimiento del deal (CRM)</div>
        ${renderActivityBox()}
      </div>

      </div>

      <div class="tab-panel ${activeTab==='acquisition'?'active':''}">
        ${(() => {
          const model = acquisitionModel(current);
          return `
        <div class="section">
          <div class="stitle"><span class="num">A1</span> Comité de inversión y repago</div>
          <div class="scenario-note"><strong>Modo de trabajo:</strong> introduce el precio acordado y los porcentajes de financiación que quieres probar. Usa <strong>Calcular escenario manual</strong> para aplicar tus porcentajes. Usa <strong>Proponer estructura ideal</strong> para que el modelo busque el mix menos dilutivo que aún repaga con confort razonable.</div>
          ${renderVerdict(model)}
          <div class="deal-summary">
            ${metric('Necesidad financiación', formatNumber(model.fundingNeed) ? formatNumber(model.fundingNeed) + ' M€' : '', 'Precio + fees')}
            ${metric('Fuentes totales', formatNumber(model.totalSources) ? formatNumber(model.totalSources) + ' M€' : '', model.fundingGap > 0.05 ? 'Faltan ' + formatNumber(model.fundingGap) + ' M€' : model.fundingGap < -0.05 ? 'Sobran ' + formatNumber(model.fundingGapAbs) + ' M€' : 'Cuadrado')}
            ${metric('Deuda total', formatNumber(model.totalDebt) ? formatNumber(model.totalDebt) + ' M€' : '', 'Banco + venture + vendor')}
            ${metric('FCF post-intereses', formatNumber(model.fcfAfterInterest) ? formatNumber(model.fcfAfterInterest) + ' M€' : '', 'Caja anual estimada')}
            ${metric('Senior leverage', formatRatio(model.leverageSenior), 'Banco + venture / EBITDA')}
            ${metric('Total leverage', formatRatio(model.leverageTotal), 'Deuda total / EBITDA')}
            ${metric('ICR', formatRatio(model.icr), 'EBITDA / intereses cash')}
            ${metric('Repago senior', model.paybackYears >= 90 ? '>7 años' : model.paybackYears.toFixed(1).replace('.', ',') + ' años', 'Con FCF post-intereses')}
          </div>
          ${renderInstrumentGrid(model)}
          <div class="plan-actions">
            <button class="uploadbtn primary-action" id="generatePlanBtn">Calcular escenario manual</button>
            <button class="uploadbtn secondary-action" id="optimizeStructureBtn">Proponer estructura ideal</button>
            <button class="uploadbtn quiet-action" id="saveScenarioBtn">Guardar escenario</button>
            <button class="uploadbtn quiet-action" id="generateLoiBtn">Generar LOI</button>
            <span class="hint">Los porcentajes manuales se aplican literalmente. Si no suman 100%, verás déficit o exceso. La estructura ideal usa porcentajes que suman 100% y filtra por ICR, leverage y repago.</span>
            ${actionNotice ? `<div class="action-notice">${escapeHtml(actionNotice)}</div>` : ''}
          </div>
          <div class="grid">
            ${field('precio_acordado_vendedor','Precio fijado con vendedor / EV acordado (M€)', {mono:true})}
            ${field('valor_empresa_tx','Valor empresa / EV (M€)', {mono:true})}
            ${field('multiplo_transaccion','Múltiplo de la transacción (x EBITDA)', {mono:true})}
            ${field('fees_transaccion','Fees y costes transacción (M€)', {mono:true})}
            ${field('conversion_ebitda_fcf','Conversión EBITDA → FCF (%)', {mono:true, placeholder:'45'})}
          </div>
        </div>

        <div class="section">
          <div class="stitle"><span class="num">A2</span> Mix de financiación</div>
          <div class="grid">
            ${field('pct_equity','% Equity manual', {mono:true, placeholder:'35'})}
            ${field('pct_deuda_bancaria','% LBO / deuda bancaria manual', {mono:true, placeholder:'35'})}
            ${field('pct_venture_debt','% Venture debt manual', {mono:true, placeholder:'10'})}
            ${field('pct_vendor_loan','% Vendor loan manual', {mono:true, placeholder:'20'})}
            ${field('capital_a_usar','Capital a usar / equity cheque (M€)', {mono:true})}
            ${field('deuda_adquisicion','Deuda de adquisición (M€)', {mono:true})}
            ${field('vendor_loan','Vendor loan a aplicar (M€)', {mono:true})}
            ${field('venture_debt','Venture debt a aplicar (M€)', {mono:true})}
            ${field('tipo_deuda_bancaria','Coste deuda bancaria (%)', {mono:true, placeholder:'8'})}
            ${field('tipo_venture_debt','Coste venture debt (%)', {mono:true, placeholder:'12'})}
            ${field('tipo_vendor_loan','Coste vendor loan / PIK (%)', {mono:true, placeholder:'5'})}
            ${field('earn_out','Earn-out / pago diferido (M€)', {mono:true})}
            ${field('caja_objetivo','Caja objetivo al cierre (M€)', {mono:true})}
            ${field('working_capital_objetivo','Working capital objetivo (M€)', {mono:true})}
          </div>
        </div>

        <div class="section">
          <div class="stitle"><span class="num">A3</span> Estructura, condiciones y tesis</div>
          <div class="grid">
            ${field('capacidad_repago','Diagnóstico de capacidad de repago', {wide:true, type:'textarea'})}
            ${field('tesis_impacto','Impacto en la tesis de adquisición', {wide:true, type:'textarea', placeholder:'Qué aporta esta empresa al roll-up: geografía, segmento, clientes, margen, sinergias, riesgos...'})}
            ${field('estructura_pago','Estructura de pago', {wide:true, type:'textarea', placeholder:'Equity inicial, deuda senior, vendor loan, earn-out, retenciones...'})}
            ${field('condiciones_clave','Condiciones clave para LOI / SPA', {wide:true, type:'textarea'})}
            ${field('riesgos_financiacion','Riesgos de financiación', {wide:true, type:'textarea'})}
            ${field('plan_adquisicion','Plan de adquisición generado', {wide:true, type:'textarea'})}
            ${field('escenario_adquisicion_guardado','Escenario guardado para comité / LOI', {wide:true, type:'textarea'})}
            ${field('loi_borrador','LOI editable para enviar al vendedor', {wide:true, type:'textarea'})}
            ${field('plan_100_dias','Plan 100 días post-cierre', {wide:true, type:'textarea'})}
          </div>
        </div>
          `;
        })()}
      </div>
      <div class="tab-panel ${activeTab==='debt'?'active':''}">
        ${renderDebtScheduleTab()}
      </div>
      <div class="savebar">
        <span id="statusMsg">${dirty? 'Cambios sin guardar' : 'Guardado'}</span>
        <button class="savebtn" id="saveBtn">Guardar ficha</button>
      </div>
    `;

    document.getElementById('nameInput').addEventListener('input', e=>{ current.nombre=e.target.value; noteChanged(); });
    main.querySelectorAll('[data-key]').forEach(el=>{
      el.addEventListener('input', e=>{ current[e.target.dataset.key]=e.target.value; noteChanged(); });
      el.addEventListener('change', e=>{ current[e.target.dataset.key]=e.target.value; noteChanged(150); });
    });
    document.getElementById('saveBtn').addEventListener('click', doSave);
    document.getElementById('delBtn').addEventListener('click', doDelete);
    main.querySelectorAll('.tabbtn').forEach(btn=>{
      btn.addEventListener('click', e=>{
        activeTab=e.target.dataset.tab;
        renderMain();
      });
    });
    const analyzeBtn = document.getElementById('analyzeBtn');
    if(analyzeBtn) analyzeBtn.addEventListener('click', handleAnalyze);
    const addNotaBtn = document.getElementById('addNotaBtn');
    if(addNotaBtn) addNotaBtn.addEventListener('click', handleAddNota);
    const generatePlanBtn = document.getElementById('generatePlanBtn');
    if(generatePlanBtn) generatePlanBtn.addEventListener('click', handleGeneratePlan);
    const optimizeStructureBtn = document.getElementById('optimizeStructureBtn');
    if(optimizeStructureBtn) optimizeStructureBtn.addEventListener('click', handleOptimizeStructure);
    const saveScenarioBtn = document.getElementById('saveScenarioBtn');
    if(saveScenarioBtn) saveScenarioBtn.addEventListener('click', handleSaveScenario);
    const generateLoiBtn = document.getElementById('generateLoiBtn');
    if(generateLoiBtn) generateLoiBtn.addEventListener('click', handleGenerateLoi);
  }

  function markDirty(){
    const msg = document.getElementById('statusMsg');
    if(msg) msg.textContent = 'Cambios sin guardar';
    const btn = document.getElementById('saveBtn');
    if(btn) btn.classList.remove('saved');
  }

  async function doSave(){
    clearTimeout(autoSaveTimer);
    if(!current.nombre || !current.nombre.trim()){ current.nombre = '(sin nombre)'; }
    await saveCompany(current);
    await loadIndex();
    dirty = false;
    render();
    const msg = document.getElementById('statusMsg');
    if(msg) msg.textContent = 'Guardado ✓';
  }

  async function doDelete(){
    if(!confirm('¿Eliminar esta ficha de forma permanente?')) return;
    await deleteCompanyApi(current.id);
    await loadIndex();
    current = null;
    render();
  }

  (async function init(){
    window.addEventListener('beforeunload', flushAutoSaveOnUnload);
    await loadIndex();
    render();
  })();
})();
</script>
</body>
</html>
